<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Liquid Logo Reveal (template)</title>
    <script src="vendor/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./vendor/three/build/three.module.js" } }
    </script>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #faf9f6; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #liquid-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      /* Wordmark: positioned and clip-wiped from js/liquid-reveal.js. Text only, no transform conflicts. */
      #wordmark {
        position: absolute; top: 0; height: 100%;
        display: flex; align-items: center; white-space: nowrap;
        font-family: "Inter", sans-serif; font-weight: 700; color: #1c1b19;
        clip-path: inset(0 100% 0 0);
      }
    </style>
  </head>
  <body>
    <!--
      Brand knobs (all read by js/liquid-reveal.js):
        data-logo-src   mark image (PNG with alpha, or SVG rasterised to a 1720px PNG)
        data-wordmark   lockup text
        data-ink        wordmark colour
        data-fields     three background colour fields (hex, comma separated)
    -->
    <div
      id="root"
      data-composition-id="liquid-logo-reveal"
      data-start="0"
      data-duration="7"
      data-fps="30"
      data-width="1920"
      data-height="1080"
      data-logo-src="assets/logo.png"
      data-wordmark="Your Brand"
      data-ink="#1c1b19"
      data-fields="#ff6b2b,#f7d3b8,#c9a48a"
    >
      <canvas id="liquid-canvas" class="clip" data-start="0" data-duration="7" data-track-index="1" aria-hidden="true"></canvas>
      <div id="wordmark" class="clip" data-start="0" data-duration="7" data-track-index="2"></div>
    </div>
    <script>
      // The WebGL layer renders from hf-seek; this timeline only gives Studio something to scrub.
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 7 });
      window.__timelines["liquid-logo-reveal"] = tl;
    </script>
    <script type="module" src="js/liquid-reveal.js"></script>
  </body>
</html>
