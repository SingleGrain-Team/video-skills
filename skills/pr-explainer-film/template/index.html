<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="film.config.js"></script>
<style>
  :root{
    --bg:#0a0a0b; --panel:#141416; --panel2:#1c1c20; --line:#2a2a30;
    --ink:#f5f1ea; --muted:#a8a49b; --accent:#ff6b2b;
    --add:#4ade80; --del:#f87171;
    --light:#faf9f6; --light-ink:#1c1b19; --light-muted:#5f5b54; --light-line:#ecebe6;
    --sans:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
  #root{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:var(--sans);color:var(--ink)}
  .scene{position:absolute;inset:0;overflow:hidden}
  .big{font-weight:700;letter-spacing:-0.04em;line-height:1.02}
  .acc{color:var(--accent)}

  /* hook */
  #hook{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center}
  #hook .big{font-size:150px}
  #hook .sub{font-size:44px;color:var(--muted);letter-spacing:-0.02em}

  /* diff scroll */
  #win{position:absolute;left:90px;top:120px;width:1130px;height:840px;background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 40px 120px -40px rgba(0,0,0,.8)}
  #winbar{height:60px;display:flex;align-items:center;gap:10px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--panel2);font:500 20px var(--mono);color:var(--muted)}
  #winbar i{width:14px;height:14px;border-radius:50%;background:#3a3a42;display:block}
  #winbar span{margin-left:14px}
  #winbody{position:absolute;left:0;right:0;top:60px;bottom:0;overflow:hidden}
  #scroll{position:absolute;left:0;right:0;top:0;will-change:transform,filter}
  .fh{height:56px;display:flex;align-items:center;gap:16px;padding:0 24px;background:#1a1a1f;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font:600 20px var(--mono);color:var(--ink);white-space:nowrap;overflow:hidden}
  .fh .pm{margin-left:auto;font-weight:500}
  .fh .a{color:var(--add)} .fh .d{color:var(--del);margin-left:10px}
  .ln{height:34px;line-height:34px;padding:0 24px;font:400 19px var(--mono);white-space:pre;overflow:hidden;color:#cfcac0}
  .ln.add{background:rgba(74,222,128,.09);color:#b6f0c9}
  .ln.del{background:rgba(248,113,113,.09);color:#f5b4b4}
  #panel{position:absolute;left:1290px;top:0;width:560px;height:1080px;display:flex;flex-direction:column;justify-content:center;gap:34px}
  #panel .head{font-size:64px}
  .stat{border-top:1px solid var(--line);padding-top:18px;display:flex;align-items:baseline;gap:18px}
  .stat b{font:600 62px var(--mono);color:var(--accent);letter-spacing:-0.03em;min-width:170px}
  .stat span{font-size:28px;color:var(--muted)}

  /* hard to read */
  #hard{display:flex;align-items:center;justify-content:center;background:#000}
  #hard .big{font-size:170px}

  /* summary (light scene) */
  #sum{background:var(--light);color:var(--light-ink);padding:120px 150px;display:flex;flex-direction:column;justify-content:center;gap:40px}
  #sum .tag{font:600 26px var(--mono);color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
  #sum .big{font-size:112px;max-width:1500px}
  #sum ul{list-style:none;display:flex;flex-direction:column;gap:22px;margin-top:10px}
  #sum li{font-size:42px;line-height:1.3;color:var(--light-muted);padding-left:44px;position:relative;letter-spacing:-0.01em}
  #sum li::before{content:"";position:absolute;left:0;top:.5em;width:18px;height:18px;border-radius:50%;background:var(--accent)}

  /* beats */
  .beat{display:flex;align-items:center;gap:90px;padding:0 130px}
  .beat .txt{flex:0 0 700px;display:flex;flex-direction:column;gap:26px}
  .beat .num{font:600 30px var(--mono);color:var(--accent)}
  .beat .big{font-size:96px}
  .beat .desc{font-size:36px;line-height:1.35;color:var(--muted);letter-spacing:-0.01em}
  .code{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px 0;box-shadow:0 40px 120px -40px rgba(0,0,0,.8)}
  .code .cap{padding:0 40px 20px;font:500 20px var(--mono);color:var(--muted)}
  .code .cl{height:54px;line-height:54px;padding:0 40px;font:400 30px var(--mono);white-space:pre;color:#cfcac0;border-left:5px solid transparent}
  .code .cl.hl{background:rgba(255,107,43,.12);border-left-color:var(--accent);color:var(--ink)}

  /* cta */
  #cta{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;text-align:center}
  #logo{width:130px;height:130px;object-fit:contain;display:none}
  #cta .big{font-size:120px}
  #cmd{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px 44px;font:500 40px var(--mono);color:var(--ink);min-width:1180px;justify-content:flex-start;box-shadow:0 0 0 2px rgba(255,107,43,.35)}
  #cmd .p{color:var(--accent);margin-right:20px}
  #cmd .car{color:var(--accent);margin-left:4px}
  #url{font-size:44px;font-weight:600;letter-spacing:-0.02em;color:var(--muted)}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="30.5" data-width="1920" data-height="1080">

  <div id="hook" class="scene clip" data-start="0" data-duration="2.0" data-track-index="1">
    <div class="big" id="hook-a"></div><div class="sub" id="hook-b"></div>
  </div>

  <div id="diff" class="scene clip" data-start="1.9" data-duration="6.2" data-track-index="2">
    <div id="win"><div id="winbar"><i></i><i></i><i></i><span id="wintitle"></span></div><div id="winbody"><div id="scroll" data-layout-allow-overflow></div></div></div>
    <div id="panel"><div class="big head" id="p-head"></div><div id="stats"></div></div>
  </div>

  <div id="hard" class="scene clip" data-start="7.8" data-duration="1.2" data-track-index="3"><div class="big" id="hard-t"></div></div>

  <div id="sum" class="scene clip" data-start="8.7" data-duration="4.6" data-track-index="4">
    <div class="tag" id="s-tag"></div><div class="big" id="s-title"></div><ul id="s-list"></ul>
  </div>

  <div class="scene clip beat" id="b0" data-start="13.0" data-duration="2.9" data-track-index="5"></div>
  <div class="scene clip beat" id="b1" data-start="15.6" data-duration="2.9" data-track-index="6"></div>
  <div class="scene clip beat" id="b2" data-start="18.2" data-duration="2.9" data-track-index="7"></div>
  <div class="scene clip beat" id="b3" data-start="20.8" data-duration="2.9" data-track-index="8"></div>

  <div id="cta" class="scene clip" data-start="23.4" data-duration="7.1" data-track-index="9">
    <img id="logo" alt="" />
    <div class="big" id="c-head"></div>
    <div id="cmd"><span class="p">$</span><span id="cmd-t"></span><span class="car" id="cmd-c">▌</span></div>
    <div id="url"></div>
  </div>
</div>

<script>
(function(){
  const F = window.FILM, $ = (s)=>document.querySelector(s);
  const tl = gsap.timeline({paused:true});
  const esc = (s)=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const fade = (sel, t, dur, hold)=>{ // scene in/out
    tl.fromTo(sel,{opacity:0},{opacity:1,duration:.3,ease:"power1.out"},t);
    tl.to(sel,{opacity:0,duration:.3,ease:"power1.in"},t+dur-.3);
  };
  const type = (el, str, t, dur)=>{ const o={p:0}; el.textContent="";
    tl.to(o,{p:1,duration:dur,ease:"none",onUpdate(){el.textContent=str.slice(0,Math.round(o.p*str.length));}},t); };
  const count = (el, n, t, dur)=>{ const o={p:0}; el.textContent="0";
    tl.to(o,{p:1,duration:dur,ease:"power2.out",onUpdate(){el.textContent=Math.round(o.p*n).toLocaleString("en-US");}},t); };

  /* ---- hook ---- */
  $("#hook-a").innerHTML = F.hook.line;
  $("#hook-b").textContent = F.hook.sub;
  fade("#hook",0,2.0);
  tl.from("#hook-a",{y:30,opacity:0,duration:.5,ease:"power3.out"},0.1);
  tl.from("#hook-b",{y:20,opacity:0,duration:.5,ease:"power3.out"},0.6);

  /* ---- diff window ---- */
  $("#wintitle").textContent = F.diff.title;
  let html="", h=0;
  while(h < 7600){
    for(const f of F.diff.files){
      html += `<div class="fh"><span>${esc(f.path)}</span><span class="pm"><span class="a">+${f.add}</span><span class="d">&minus;${f.del}</span></span></div>`; h+=56;
      for(const l of f.lines){
        const c = l[0]==="+"?"add":(l[0]==="-"?"del":"");
        html += `<div class="ln ${c}">${esc(l)}</div>`; h+=34;
      }
    }
  }
  $("#scroll").innerHTML = html;
  $("#p-head").innerHTML = F.diff.headline;
  $("#stats").innerHTML = F.diff.stats.map((s,i)=>`<div class="stat" id="st${i}"><b></b><span>${esc(s.label)}</span></div>`).join("");
  fade("#diff",1.9,6.2);
  const D=1.9;
  tl.fromTo("#win",{scale:1.04,opacity:0},{scale:1,opacity:1,duration:.5,ease:"power3.out"},D);
  tl.fromTo("#scroll",{y:0},{y:-6400,duration:4.6,ease:"power2.in"},D+.6);       // too fast to follow
  tl.fromTo("#scroll",{filter:"blur(0px)"},{filter:"blur(3px)",duration:3,ease:"power2.in",immediateRender:false},D+1.8);
  tl.from("#p-head",{y:24,opacity:0,duration:.4,ease:"power3.out"},D+.5);
  F.diff.stats.forEach((s,i)=>{
    const row=$("#st"+i); tl.from(row,{y:18,opacity:0,duration:.3,ease:"power3.out"},D+1+i*.45);
    count(row.querySelector("b"), s.value, D+1.1+i*.45, .7);
  });

  /* ---- hard to read ---- */
  $("#hard-t").innerHTML = F.hardRead;
  fade("#hard",7.8,1.2);
  tl.from("#hard-t",{scale:.94,opacity:0,duration:.4,ease:"power3.out"},7.85);

  /* ---- plain-language summary ---- */
  $("#s-tag").textContent = F.summary.tag;
  $("#s-title").innerHTML = F.summary.title;
  $("#s-list").innerHTML = F.summary.points.map(p=>`<li>${esc(p)}</li>`).join("");
  fade("#sum",8.7,4.6);
  tl.from("#s-tag",{y:16,opacity:0,duration:.35,ease:"power3.out"},9.0);
  tl.from("#s-title",{y:30,opacity:0,duration:.55,ease:"power3.out"},9.15);
  document.querySelectorAll("#s-list li").forEach((li,i)=>tl.from(li,{x:-24,opacity:0,duration:.4,ease:"power3.out"},10.0+i*.6));

  /* ---- capability beats ---- */
  F.beats.slice(0,4).forEach((b,i)=>{
    const id="#b"+i, t=13.0+i*2.6, el=$(id);
    el.innerHTML = `<div class="txt"><div class="num">0${i+1} / 0${F.beats.length}</div><div class="big">${b.title}</div><div class="desc">${esc(b.desc)}</div></div>
      <div class="code"><div class="cap">${esc(b.file)}</div>${b.code.map(c=>`<div class="cl${c.hl?" hl":""}">${esc(c.t)}</div>`).join("")}</div>`;
    fade(id,t,2.9);
    tl.from(id+" .num",{y:14,opacity:0,duration:.3,ease:"power3.out"},t+.15);
    tl.from(id+" .big",{y:26,opacity:0,duration:.45,ease:"power3.out"},t+.25);
    tl.from(id+" .desc",{y:18,opacity:0,duration:.4,ease:"power3.out"},t+.55);
    tl.from(id+" .code",{x:60,opacity:0,duration:.5,ease:"power3.out"},t+.2);
    el.querySelectorAll(".cl").forEach((c,k)=>tl.from(c,{opacity:0,x:16,duration:.25,ease:"power2.out"},t+.55+k*.18));
  });

  /* ---- CTA ---- */
  if(F.cta.logo){ const l=$("#logo"); l.src=F.cta.logo; l.style.display="block"; tl.from(l,{scale:.8,opacity:0,duration:.5,ease:"back.out(1.6)"},23.6); }
  $("#c-head").innerHTML = F.cta.head;
  $("#url").textContent = F.cta.url;
  tl.fromTo("#cta",{opacity:0},{opacity:1,duration:.4,ease:"power1.out"},23.4);
  tl.from("#c-head",{y:30,opacity:0,duration:.5,ease:"power3.out"},23.8);
  tl.from("#cmd",{y:30,opacity:0,duration:.5,ease:"power3.out"},24.3);
  type($("#cmd-t"), F.cta.command, 24.8, 1.9);
  tl.fromTo("#cmd-c",{opacity:1},{opacity:0,duration:.5,ease:"steps(1)",repeat:7,yoyo:true},24.8);
  tl.from("#url",{y:20,opacity:0,duration:.5,ease:"power3.out"},27.0);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
})();
</script>
</body>
</html>
